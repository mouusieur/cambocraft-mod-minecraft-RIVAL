name: Vérifications
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: tools/test_java.sh --simulate
      - run: python3 -m unittest discover -s tests -v
      - run: ./gradlew build
      - name: GameTests Minecraft
        run: |
          ./gradlew runGametest --console=plain > gametest.log 2>&1 || {
            grep -E 'ERROR|failed|Failed|Exception|Caused by:|dimension|tests? (passed|failed)|\[[-+X ]+\]' gametest.log | tail -n 25 | python3 -c 'import sys; s=sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"); print("::error::" + s)'
            exit 1
          }
      - name: Serveur réel et redémarrage
        run: |
          trap 'for f in servercheck-*.log; do test ! -f "$f" || tail -n 80 "$f"; done' ERR
          mkdir -p build/servercheck
          echo 'eula=true' > build/servercheck/eula.txt
          printf 'online-mode=false\nserver-port=0\nview-distance=2\nsimulation-distance=2\nspawn-protection=0\n' > build/servercheck/server.properties
          timeout 300 ./gradlew runServercheck --console=plain > servercheck-first.log 2>&1
          grep -q CAMBO_SERVER_WORLD_OK servercheck-first.log
          grep -q CAMBO_SERVER_STOP_OK servercheck-first.log
          CAMBO_RESTART_CHECK=1 timeout 300 ./gradlew runServercheck --console=plain > servercheck-restart.log 2>&1
          grep -q CAMBO_SERVER_RESTART_OK servercheck-restart.log
          grep -q CAMBO_SERVER_STOP_OK servercheck-restart.log
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/bot/package-lock.json
      - name: Voyage expérimental avec client headless
        run: |
          npm ci --prefix tools/bot --ignore-scripts --no-audit --no-fund
          python3 tools/bot/run_portal_test.py
      - uses: actions/upload-artifact@v6
        with:
          name: cambocraft-jars
          path: build/libs/*.jar
          if-no-files-found: error
