name: Vérifications
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: tools/test_java.sh --simulate
      - run: python3 -m unittest discover -s tests -v
      - run: ./gradlew build
      - name: GameTests Minecraft
        run: |
          ./gradlew runGametest --console=plain > gametest.log 2>&1 || {
            tail -n 30 gametest.log | python3 -c 'import sys; s=sys.stdin.read().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"); print("::error::" + s)'
            exit 1
          }
      - uses: actions/upload-artifact@v6
        with:
          name: cambocraft-jars
          path: build/libs/*.jar
          if-no-files-found: error
